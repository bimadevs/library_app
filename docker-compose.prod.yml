##############################################
# School Library - Production Overrides
##############################################
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  app:
    restart: always
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "1.0"
        reservations:
          memory: 128M

  nginx:
    restart: always
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.5"

  mysql:
    restart: always
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
        reservations:
          memory: 256M

  redis:
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  queue:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
